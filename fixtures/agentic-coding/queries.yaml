    status: frozen
    resembles: agentic-coding.requirements.ground-user-goal
    expect: agentic-coding.requirements.define-acceptance-and-non-goals
    text: "we agree creators must be able to retry one failed file without re-uploading the ones that succeeded; what is missing is a list of which checks must pass before I call the task done"
  - id: requirements.ground-user-goal.n2
