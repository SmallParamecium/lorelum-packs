fixture_set: agentic-coding-queries
evaluation_only: true
description: Retrieval query hypotheses for the 34 agentic-coding Practices; each Practice contributes 3 positive queries and 2 neighbor queries that are worded near that Practice but expected to select its nearest neighbor (per agentic-coding-practice-catalog). The merged planning.decide-scope-and-stop-conditions carries the query blocks of both predecessors plus one fixed-scope-entry positive (7 positive, 4 neighbor; two neighbors anchor its secondary neighbor implementation.confirm-product-surface-expansion). The two new planning-calibration Practices (derive-committed-set-from-concerns, keep-acceptance-path-completable) contribute 3 positive and 2 neighbor queries each; their neighbor expectations follow decide-scope-and-stop-conditions and implementation.validate-at-the-owning-boundary. Queries are written as situations; CI checks overlap with Practice titles and applies_when, but does not automatically check Guidance or other body text. Not a runtime input or proof of retrieval quality.
target_pack: agentic-coding@0.5.1
top_k: 3
min_top3: 0.90
practice_migrations:
  - old_practice: agentic-coding.planning.admit-only-currently-justified-work
    new_practice: agentic-coding.planning.decide-scope-and-stop-conditions
    kind: merge
    reason: "The predecessor Practice no longer has an independent decision boundary."
    query_ids:
      - planning.admit-only-currently-justified-work.p1
      - planning.admit-only-currently-justified-work.p2
      - planning.admit-only-currently-justified-work.p3
  - old_practice: agentic-coding.planning.define-stop-condition
    new_practice: agentic-coding.planning.decide-scope-and-stop-conditions
    kind: merge
    reason: "The predecessor Practice no longer has an independent decision boundary."
    query_ids:
      - planning.define-stop-condition.p1
      - planning.define-stop-condition.p2
      - planning.define-stop-condition.p3
